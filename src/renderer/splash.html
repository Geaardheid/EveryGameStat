<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file:; font-src 'self' file:">
<style>
@font-face { font-family: "Unbounded"; font-weight: 800; src: url("../../assets/fonts/unbounded-800.ttf"); }
@font-face { font-family: "Chakra Petch"; font-weight: 400; src: url("../../assets/fonts/chakrapetch-400.ttf"); }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; }
.card { position: absolute; inset: 0; border-radius: 22px; background: #131316; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 30px 80px rgba(0,0,0,.7); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; -webkit-app-region: drag; }
.logo { position: relative; width: 120px; height: 120px; display: grid; place-items: center; }
.logo img { width: 74px; height: 74px; border-radius: 18px; animation: pulse 1.4s ease-in-out infinite; }
.ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(242,176,61,.16); border-top-color: #F2B03D; animation: spin 1.1s linear infinite; }
.ring.b { inset: 10px; border-color: rgba(110,212,188,.12); border-top-color: transparent; border-bottom-color: #6ED4BC; animation: spin 1.8s linear infinite reverse; }
.t { font: 800 22px "Unbounded", sans-serif; letter-spacing: .08em; color: #F4F3F2; }
.t b { color: #F2B03D; }
.s { font: 12px "Chakra Petch", sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #A9A7A2; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
</style></head>
<body><div class="card"><div class="logo"><span class="ring"></span><span class="ring b"></span><img src="../../assets/icon.png" alt=""></div><div class="t">EVERY <b>GAME</b> STAT</div><div class="s" id="s">Starting…</div></div></body></html>
