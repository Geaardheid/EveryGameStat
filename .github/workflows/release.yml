# Bouwt de Windows-installer in de cloud en publiceert 'm als GitHub Release.
# Gebruik: tag pushen (git tag v0.2.0 && git push --tags) of handmatig starten.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      # Dependency-audit per release, als JSON bij de release; het admin-panel leest dit uit
      - run: npm audit --json > audit.json || echo "audit had findings"
        shell: bash
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach audit.json to the release
        uses: softprops/action-gh-release@v2
        with:
          files: audit.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
