# Bouwt de Windows-installer in de cloud en publiceert 'm als GitHub Release.
# Gebruik: tag pushen (git tag v0.2.0 && git push --tags) of handmatig starten.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      # Dependency-audit per release, als JSON bij de release; het admin-panel leest dit uit
      - run: npm audit --json > audit.json || echo "audit had findings"
        shell: bash
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # audit.json erbij; mag de release nooit laten falen
      - name: Attach audit.json to the release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF_NAME}" audit.json --clobber || echo "audit upload skipped"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
